<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Designer — Daemons Monza e Brianza</title>
<style>
  :root {
    --bg: #111827; --panel: #1f2937; --panel-2: #374151; --border: #374151;
    --text: #f3f4f6; --muted: #9ca3af; --accent: #22c55e; --accent-ring: #4ade80;
    --meters: #eab308; --yards: #3b82f6;
    --turf: #0a5d27; --endzone: #06421c; --line: #ffffff; --dim: #facc15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem; gap: 1rem; }
  header, main, footer { width: 100%; max-width: 80rem; }
  header { text-align: center; }
  h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); color: var(--accent-ring); letter-spacing: .04em; }
  header p { margin: .4rem 0 0; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; align-items: center; }
  .pill { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; background: var(--panel);
    border: 1px solid var(--border); border-radius: 999px; padding: .4rem; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  .seg { border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: .9rem; color: #d1d5db;
    background: var(--panel-2); padding: .55rem 1.1rem; border-radius: 999px; transition: background .2s; }
  .seg:hover { background: #4b5563; }
  .seg[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg:focus-visible, .switch:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; }
  .toggle { display: flex; align-items: center; gap: .6rem; padding: 0 .3rem 0 .6rem; font-size: .85rem; color: #d1d5db; }
  .switch { position: relative; width: 2.75rem; height: 1.5rem; border: 0; border-radius: 999px; cursor: pointer;
    background: #4b5563; transition: background .25s; }
  .switch::after { content: ""; position: absolute; top: .25rem; left: .25rem; width: 1rem; height: 1rem;
    background: #fff; border-radius: 50%; transition: transform .25s; }
  .switch[aria-pressed="true"]::after { transform: translateX(1.25rem); }
  .switch[aria-pressed="true"][data-c="numbers"] { background: var(--accent); }
  .switch[aria-pressed="true"][data-c="meters"] { background: var(--meters); }
  .switch[aria-pressed="true"][data-c="yards"] { background: var(--yards); }
  .btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; font-size: .85rem;
    padding: .5rem .9rem; border-radius: 999px; cursor: pointer; }
  .btn:hover { background: var(--panel-2); }
  .custom { display: none; flex-wrap: wrap; gap: .75rem 1.25rem; justify-content: center; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 1rem; padding: .8rem 1rem; font-size: .85rem; }
  .custom.on { display: flex; }
  .custom label { display: flex; align-items: center; gap: .4rem; color: #d1d5db; }
  .custom input[type=number] { width: 4.5rem; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: .4rem; padding: .3rem .4rem; font: inherit; }
  .stage { margin-top: .25rem; padding: 1rem; background: var(--panel); border: 1px solid var(--border);
    border-radius: 1rem; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
  .stage svg { display: block; width: 100%; height: auto; max-height: 78vh; }
  footer { text-align: center; color: #6b7280; font-size: .85rem; }
  body.embed header, body.embed footer, body.embed .actions { display: none; }
  body.embed .app { padding: .5rem; }
  @media print {
    :root { --bg: #fff; }
    header p, .toolbar, .custom, footer { display: none !important; }
    h1 { color: #000; font-size: 18pt; }
    .stage { border: 0; box-shadow: none; padding: 0; background: #fff; }
    .stage svg { max-height: none; }
    @page { size: landscape; margin: 10mm; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>American Football Field Designer</h1>
    <p>Seleziona una categoria per visualizzare il tracciato del campo.</p>
  </header>

  <main>
    <div class="toolbar">
      <div class="pill" id="types" role="group" aria-label="Categoria"></div>
      <div class="pill" id="toggles"></div>
      <div class="pill actions">
        <button class="btn" id="dl-svg">SVG</button>
        <button class="btn" id="dl-png">PNG</button>
        <button class="btn" id="print">Stampa</button>
        <button class="btn" id="share">Copia link</button>
      </div>
    </div>

    <div class="custom" id="custom" style="margin-top:.75rem">
      <label>Campo di gioco (yd) <input type="number" id="c-play" min="20" max="100" step="1"></label>
      <label>Larghezza (yd) <input type="number" id="c-width" min="20" max="60" step="0.1"></label>
      <label>End zone (yd) <input type="number" id="c-ez" min="0" max="15" step="1"></label>
      <label><input type="checkbox" id="c-dash5"> Tratteggiate ogni 5 yd</label>
      <label><input type="checkbox" id="c-hash"> Hash marks</label>
      <label><input type="checkbox" id="c-num"> Numeri</label>
      <label><input type="checkbox" id="c-tech"> Aree tecniche</label>
    </div>

    <div class="stage"><div id="field"></div></div>
  </main>

  <footer><p>Progettato per allenatori e team per una facile visualizzazione.</p></footer>
</div>

<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------------
   * CONFIGURAZIONE CAMPI
   * Tutte le misure sono in yard, misurate dalla linea di meta.
   * continuous / dashed: linee su un lato; vengono specchiate
   * automaticamente (tranne quella di metà campo).
   * ------------------------------------------------------------------ */
  const PRESETS = {
    master: {
      label: 'Master', totalLength: 90, totalWidth: 35, endzoneDepth: 10,
      continuous: [10, 20, 30, 35], dashed: [5, 15, 25], centerHash: true,
    },
    u1518: {
      label: 'Under 15/18', totalLength: 120, totalWidth: 45, endzoneDepth: 10,
      continuous: [10, 20, 30, 40, 50], dashed: [25, 35],
      tech: { startYard: 20, depth: 5, offset: 2 },
      hashes: [3 / 8, 5 / 8], numbers: true, numberOffset: 8,
    },
    senior: {
      label: 'Senior', totalLength: 120, totalWidth: 54, endzoneDepth: 10,
      continuous: [10, 20, 30, 40, 50], dashed: [25, 35],
      tech: { startYard: 20, depth: 5, offset: 2 },
      hashes: [3 / 8, 5 / 8], numbers: true, numberOffset: 8,
    },
    flag: {
      label: 'Flag', totalLength: 70, totalWidth: 35, endzoneDepth: 10,
      continuous: [25], dashed: [], flagMarkers: { distanceFromGoal: 5, length: 2 },
    },
    custom: { label: 'Personalizzato' },
  };

  const CUSTOM_DEFAULTS = { play: 94, width: 53.3, ez: 10, dash5: false, hash: true, num: true, tech: true };

  /* Campo personalizzato: linee continue ogni 10 yd + metà campo,
   * metà campo etichettata sempre "50" (come sui campi corti). */
  function buildCustom(c) {
    const half = c.play / 2;
    const tens = [], fives = [];
    for (let y = 10; y < half - 0.01; y += 10) tens.push(y);
    for (let y = 5; y < half - 0.01; y += 10) fives.push(y);
    return {
      label: 'Personalizzato', totalLength: c.play + 2 * c.ez, totalWidth: c.width, endzoneDepth: c.ez,
      continuous: [...tens, half], dashed: c.dash5 ? fives : [],
      tech: c.tech ? { startYard: Math.min(20, half - 5), depth: 5, offset: 2 } : null,
      hashes: c.hash ? [3 / 8, 5 / 8] : null,
      numbers: c.num, numberOffset: 8,
    };
  }

  /* ------------------------------------------------------------------
   * STATO (sincronizzato con la query string → link condivisibili)
   * ------------------------------------------------------------------ */
  const qs = new URLSearchParams(location.search);
  const bool = (k, d) => qs.has(k) ? qs.get(k) === '1' : d;
  const num = (k, d) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) ? v : d; };

  const state = {
    type: PRESETS[qs.get('campo')] ? qs.get('campo') : 'senior',
    numbers: bool('numeri', false),
    meters: bool('metri', true),
    yards: bool('yard', false),
    custom: {
      play: num('cl', CUSTOM_DEFAULTS.play), width: num('cw', CUSTOM_DEFAULTS.width), ez: num('ce', CUSTOM_DEFAULTS.ez),
      dash5: bool('c5', CUSTOM_DEFAULTS.dash5), hash: bool('ch', CUSTOM_DEFAULTS.hash),
      num: bool('cn', CUSTOM_DEFAULTS.num), tech: bool('ct', CUSTOM_DEFAULTS.tech),
    },
  };
  if (qs.get('embed') === '1') document.body.classList.add('embed');

  function syncUrl() {
    const p = new URLSearchParams();
    p.set('campo', state.type);
    p.set('numeri', +state.numbers); p.set('metri', +state.meters); p.set('yard', +state.yards);
    if (state.type === 'custom') {
      const c = state.custom;
      p.set('cl', c.play); p.set('cw', c.width); p.set('ce', c.ez);
      p.set('c5', +c.dash5); p.set('ch', +c.hash); p.set('cn', +c.num); p.set('ct', +c.tech);
    }
    if (document.body.classList.contains('embed')) p.set('embed', '1');
    history.replaceState(null, '', '?' + p.toString());
  }

  const currentConfig = () => state.type === 'custom' ? buildCustom(state.custom) : PRESETS[state.type];

  /* ------------------------------------------------------------------
   * RENDER SVG
   * ------------------------------------------------------------------ */
  const YD_TO_M = 0.9144;
  const W = 0.5; // spessore linee (yd) — scala visiva, non regolamentare

  function renderField(cfg, opt) {
    const { totalLength: L, totalWidth: H, endzoneDepth: ez } = cfg;
    const play = L - 2 * ez, half = play / 2;
    const pad = 15;
    const techDepth = cfg.tech ? cfg.tech.depth + cfg.tech.offset : 0;
    const vb = [-pad, -(pad + techDepth), L + 2 * pad, H + 2 * pad + 2 * techDepth];
    const out = [];
    const line = (x1, y1, x2, y2, extra = '') =>
      out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line,#fff)" stroke-width="${W}" ${extra}/>`);
    const isHalf = y => Math.abs(y - half) < 1e-6;
    const mirror = y => L - (ez + y);

    // Fondo, end zone, perimetro, linee di meta
    out.push(`<rect x="0" y="0" width="${L}" height="${H}" fill="var(--turf,#0a5d27)"/>`);
    if (ez > 0) {
      out.push(`<rect x="0" y="0" width="${ez}" height="${H}" fill="var(--endzone,#06421c)" fill-opacity=".7"/>`);
      out.push(`<rect x="${L - ez}" y="0" width="${ez}" height="${H}" fill="var(--endzone,#06421c)" fill-opacity=".7"/>`);
    }
    out.push(`<rect x="0" y="0" width="${L}" height="${H}" fill="none" stroke="var(--line,#fff)" stroke-width="${W}"/>`);
    line(ez, 0, ez, H); line(L - ez, 0, L - ez, H);

    // Misure (sotto le linee, come nell'originale)
    if (opt.meters || opt.yards) out.push(measurements(cfg, opt, pad));

    // Linee continue e tratteggiate
    for (const y of cfg.continuous || []) {
      line(ez + y, 0, ez + y, H);
      if (!isHalf(y)) line(mirror(y), 0, mirror(y), H);
    }
    for (const y of cfg.dashed || []) {
      line(ez + y, 0, ez + y, H, 'stroke-dasharray="2 2"');
      if (!isHalf(y)) line(mirror(y), 0, mirror(y), H, 'stroke-dasharray="2 2"');
    }

    // Linee "numerate": multipli di 10 sotto metà campo + metà campo
    const numbered = (cfg.continuous || []).filter(y => y % 10 === 0 || isHalf(y));

    // Hash marks e tacche dei numeri (2 yd centrate sulla linea)
    if (cfg.hashes) {
      for (const y of numbered) {
        const xs = isHalf(y) ? [ez + y] : [ez + y, mirror(y)];
        for (const x of xs) {
          for (const f of cfg.hashes) line(x - 1, H * f, x + 1, H * f);
          if (cfg.numbers && cfg.numberOffset) {
            line(x - 1, cfg.numberOffset, x + 1, cfg.numberOffset);
            line(x - 1, H - cfg.numberOffset, x + 1, H - cfg.numberOffset);
          }
        }
      }
    }

    // Hash centrale (Master)
    if (cfg.centerHash) line(L / 2 - 1, H / 2, L / 2 + 1, H / 2);

    // Marker Flag
    if (cfg.flagMarkers) {
      const { distanceFromGoal: d, length: len } = cfg.flagMarkers;
      const y = H / 2 - len / 2;
      out.push(`<rect x="${ez + d}" y="${y}" width="${W}" height="${len}" fill="var(--line,#fff)"/>`);
      out.push(`<rect x="${L - ez - d}" y="${y}" width="${W}" height="${len}" fill="var(--line,#fff)"/>`);
    }

    // Aree tecniche
    if (cfg.tech) {
      const { startYard: s, depth: d, offset: o } = cfg.tech;
      const x = ez + s, w = play - 2 * s;
      out.push(`<g stroke="var(--line,#fff)" stroke-width="${W}" fill="none">
        <rect x="${x}" y="${-o - d}" width="${w}" height="${d}"/>
        <rect x="${x}" y="${H + o}" width="${w}" height="${d}"/></g>`);
    }

    // Numeri: leggibili dalla rispettiva sideline (in basso dritti, in alto ruotati di 180°)
    if (cfg.numbers && opt.numbers && cfg.numberOffset) {
      const g = ['<g fill="var(--line,#fff)" font-size="2.8" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif">'];
      for (const y of numbered) {
        const label = isHalf(y) ? 50 : y;
        const xs = isHalf(y) ? [ez + y] : [ez + y, mirror(y)];
        for (const x of xs) {
          const yb = H - cfg.numberOffset - 2, yt = cfg.numberOffset + 2;
          g.push(`<text x="${x}" y="${yb}">${label}</text>`);
          g.push(`<text x="${x}" y="${yt}" transform="rotate(180 ${x} ${yt})">${label}</text>`);
        }
      }
      g.push('</g>');
      out.push(g.join(''));
    }

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet"
      role="img" aria-label="Tracciato campo ${cfg.label}">
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="var(--dim,#facc15)"/></marker></defs>
      ${out.join('\n')}</svg>`;
  }

  function measurements(cfg, opt, pad) {
    const { totalLength: L, totalWidth: H, endzoneDepth: ez } = cfg;
    const play = L - 2 * ez;
    const fmt = v => {
      const r = +v.toFixed(2);
      const m = (v * YD_TO_M).toFixed(2) + 'm', y = r + 'yd';
      return opt.meters && opt.yards ? `${m} / ${y}` : opt.meters ? m : y;
    };
    const el = [];
    const ts = 'fill="var(--dim,#facc15)" font-size="2.8" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,sans-serif"';
    const ls = 'stroke="var(--dim,#facc15)" stroke-width=".25"';
    const arrows = 'marker-start="url(#arrow)" marker-end="url(#arrow)"';
    const dash = 'stroke-dasharray="1 1"';
    const dim = (v, p1, p2, off, dir) => {
      if (dir === 'h') {
        const y = p1.y + off, ty = y + (off > 0 ? 3 : -2);
        el.push(`<line x1="${p1.x}" y1="${p1.y}" x2="${p1.x}" y2="${y}" ${ls} ${dash}/>`,
                `<line x1="${p2.x}" y1="${p2.y}" x2="${p2.x}" y2="${y}" ${ls} ${dash}/>`,
                `<line x1="${p1.x}" y1="${y}" x2="${p2.x}" y2="${y}" ${ls} ${arrows}/>`,
                `<text x="${(p1.x + p2.x) / 2}" y="${ty}" ${ts}>${fmt(v)}</text>`);
      } else {
        const x = p1.x + off, tx = x + (off > 0 ? 4 : -2.5), my = (p1.y + p2.y) / 2;
        el.push(`<line x1="${p1.x}" y1="${p1.y}" x2="${x}" y2="${p1.y}" ${ls} ${dash}/>`,
                `<line x1="${p2.x}" y1="${p2.y}" x2="${x}" y2="${p2.y}" ${ls} ${dash}/>`,
                `<line x1="${x}" y1="${p1.y}" x2="${x}" y2="${p2.y}" ${ls} ${arrows}/>`,
                `<text x="${tx}" y="${my}" transform="rotate(90 ${tx} ${my})" ${ts}>${fmt(v)}</text>`);
      }
    };

    dim(L, { x: 0, y: 0 }, { x: L, y: 0 }, -pad / 2, 'h');
    dim(H, { x: L, y: 0 }, { x: L, y: H }, pad / 2, 'v');
    dim(play, { x: ez, y: H }, { x: L - ez, y: H }, pad / 2.5, 'h');
    if (ez > 0) dim(ez, { x: 0, y: H / 4 }, { x: ez, y: H / 4 }, -4, 'h');

    if (cfg.tech) {
      const { startYard: s, depth: d, offset: o } = cfg.tech;
      const x = ez + s, w = play - 2 * s, tx = x + w / 2;
      el.push(`<text x="${tx}" y="${-o - d / 2}" ${ts}>${fmt(w)}</text>`,
              `<text x="${tx}" y="${H + o + d / 2}" ${ts}>${fmt(w)}</text>`);
      dim(d, { x: x + w, y: -o - d }, { x: x + w, y: -o }, 4, 'v');
    }
    if (cfg.hashes && cfg.hashes.length >= 2) {
      const mx = L - ez + 5, [a, b] = cfg.hashes;
      dim(H * a, { x: mx, y: 0 }, { x: mx, y: H * a }, 4, 'v');
      dim(H * (b - a), { x: mx, y: H * a }, { x: mx, y: H * b }, 4, 'v');
      dim(H * (1 - b), { x: mx, y: H * b }, { x: mx, y: H }, 4, 'v');
    }
    if (cfg.numbers && cfg.numberOffset) {
      const mx = ez - 5, n = cfg.numberOffset;
      dim(n, { x: mx, y: 0 }, { x: mx, y: n }, -4, 'v');
      dim(H - 2 * n, { x: mx, y: n }, { x: mx, y: H - n }, -4, 'v');
      dim(n, { x: mx, y: H - n }, { x: mx, y: H }, -4, 'v');
    }
    dim(H / 2, { x: 0, y: 0 }, { x: 0, y: H / 2 }, -6, 'v');
    dim(H / 2, { x: 0, y: H / 2 }, { x: 0, y: H }, -6, 'v');
    return `<g>${el.join('')}</g>`;
  }

  /* ------------------------------------------------------------------
   * UI
   * ------------------------------------------------------------------ */
  const $ = id => document.getElementById(id);
  const fieldEl = $('field');

  // Selettore categorie
  for (const [key, p] of Object.entries(PRESETS)) {
    const b = document.createElement('button');
    b.className = 'seg'; b.textContent = p.label; b.dataset.type = key;
    b.onclick = () => { state.type = key; update(); };
    $('types').appendChild(b);
  }

  // Toggle
  const TOGGLES = [['numbers', 'Numeri'], ['meters', 'Metri'], ['yards', 'Yard']];
  for (const [key, label] of TOGGLES) {
    const wrap = document.createElement('div');
    wrap.className = 'toggle'; wrap.dataset.key = key;
    wrap.innerHTML = `<span id="lbl-${key}">${label}</span>
      <button class="switch" data-c="${key}" aria-labelledby="lbl-${key}"></button>`;
    wrap.querySelector('button').onclick = () => { state[key] = !state[key]; update(); };
    $('toggles').appendChild(wrap);
  }

  // Campo personalizzato
  const C = { play: 'c-play', width: 'c-width', ez: 'c-ez', dash5: 'c-dash5', hash: 'c-hash', num: 'c-num', tech: 'c-tech' };
  for (const [k, id] of Object.entries(C)) {
    const inp = $(id);
    if (inp.type === 'checkbox') inp.checked = state.custom[k]; else inp.value = state.custom[k];
    inp.addEventListener('input', () => {
      if (inp.type === 'checkbox') state.custom[k] = inp.checked;
      else { const v = parseFloat(inp.value); if (Number.isFinite(v) && v >= +inp.min && v <= +inp.max) state.custom[k] = v; else return; }
      update();
    });
  }

  function update() {
    const cfg = currentConfig();
    document.querySelectorAll('#types .seg').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === state.type));
    document.querySelectorAll('#toggles .toggle').forEach(t => {
      const k = t.dataset.key;
      t.style.display = (k === 'numbers' && !cfg.numbers) ? 'none' : '';
      t.querySelector('button').setAttribute('aria-pressed', state[k]);
    });
    $('custom').classList.toggle('on', state.type === 'custom');
    fieldEl.innerHTML = renderField(cfg, state);
    syncUrl();
  }

  /* ------------------------------------------------------------------
   * EXPORT
   * ------------------------------------------------------------------ */
  // SVG standalone: risolve le CSS var nei valori concreti
  function standaloneSvg() {
    const cs = getComputedStyle(document.documentElement);
    return fieldEl.innerHTML.replace(/var\(--([\w-]+),([^)]+)\)/g, (_, n, d) => cs.getPropertyValue('--' + n).trim() || d);
  }
  const fileName = ext => `campo-${state.type}.${ext}`;
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('dl-svg').onclick = () => download(new Blob([standaloneSvg()], { type: 'image/svg+xml' }), fileName('svg'));
  $('dl-png').onclick = () => {
    const svg = standaloneSvg();
    const vb = svg.match(/viewBox="([^"]+)"/)[1].split(' ').map(Number);
    const scale = 20; // px per yard
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = vb[2] * scale; c.height = vb[3] * scale;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1f2937'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => download(b, fileName('png')), 'image/png');
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  };
  $('print').onclick = () => window.print();
  $('share').onclick = async () => {
    const btn = $('share');
    try { await navigator.clipboard.writeText(location.href); btn.textContent = 'Copiato ✓'; }
    catch { btn.textContent = 'Copia non riuscita'; }
    setTimeout(() => (btn.textContent = 'Copia link'), 1500);
  };

  update();
})();
</script>
</body>
</html>
